name: Disposable network policy

on:
  push:

permissions:
  contents: read

jobs:
  routed-packet-policy:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Do not archive the shared host cache: concurrent writers can make
          # its post-job tar exceed this packet acceptance job's deadline.
          cache: false
      - name: Isolate disposable Go build cache
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cache=$(mktemp -d "${RUNNER_TEMP}/network-go-cache.XXXXXXXX")
          echo "GOCACHE=${cache}" >> "${GITHUB_ENV}"
      - name: Build and exercise isolated routed packet policy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence=$(mktemp -d "${RUNNER_TEMP}/network-policy.XXXXXXXX")
          echo "PROVENANCE_NETWORK_EVIDENCE=${evidence}" >> "${GITHUB_ENV}"
          git rev-parse HEAD > "${evidence}/source-commit.txt"
          docker build --iidfile "${evidence}/fixture-image.txt" \
            -f scripts/network-policy/Dockerfile scripts/network-policy
          image=$(< "${evidence}/fixture-image.txt")
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 -B scripts/network-policy/acceptance.py --image "$image" \
            2>&1 | tee "${evidence}/packet-acceptance.log"
      - name: Verify additive hosted egress boundary in disposable namespaces
        shell: bash
        run: |
          set -euo pipefail
          image=$(< "${PROVENANCE_NETWORK_EVIDENCE}/fixture-image.txt")
          bash -n scripts/test-measured-host-egress-fixture.sh
          bash scripts/test-measured-host-egress-fixture.sh "$image" \
            2>&1 | tee "${PROVENANCE_NETWORK_EVIDENCE}/host-egress-acceptance.log"
      - name: Exercise controlled DNS packets and firewall lifecycle
        shell: bash
        run: |
          set -euo pipefail
          image=$(< "${PROVENANCE_NETWORK_EVIDENCE}/fixture-image.txt")
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 -B scripts/network-policy/dns_acceptance.py --image "$image" \
            2>&1 | tee "${PROVENANCE_NETWORK_EVIDENCE}/dns-acceptance.log"
      - name: Verify retained child namespace ownership in disposable kernel
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest scripts/test_namespace_acceptance.py
          image=$(< "${PROVENANCE_NETWORK_EVIDENCE}/fixture-image.txt")
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 -B scripts/network-policy/namespace_acceptance.py --image "$image" \
            2>&1 | tee "${PROVENANCE_NETWORK_EVIDENCE}/namespace-acceptance.log"
      - name: Verify exclusive job cgroup descendant cleanup
        shell: bash
        run: |
          set -euo pipefail
          image=$(< "${PROVENANCE_NETWORK_EVIDENCE}/fixture-image.txt")
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 -B -m unittest scripts/test_job_cgroup_acceptance.py
          python3 -B scripts/network-policy/job_cgroup_acceptance.py --image "$image" \
            2>&1 | tee "${PROVENANCE_NETWORK_EVIDENCE}/job-cgroup-acceptance.log"
      - name: Exercise caller-mapped Sentry through isolated routed policy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          docker build --iidfile "${PROVENANCE_NETWORK_EVIDENCE}/sentry-image.txt" \
            -f scripts/network-policy/Dockerfile.sentry scripts/network-policy
          image=$(< "${PROVENANCE_NETWORK_EVIDENCE}/sentry-image.txt")
          [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
          python3 -B scripts/network-policy/acceptance.py --image "$image" --sentry \
            2>&1 | tee "${PROVENANCE_NETWORK_EVIDENCE}/sentry-acceptance.log"
          python3 -B scripts/network-policy/dns_acceptance.py --image "$image" --sentry \
            2>&1 | tee "${PROVENANCE_NETWORK_EVIDENCE}/sentry-dns-acceptance.log"
          python3 -B scripts/network-policy/namespace_acceptance.py --image "$image" --sentry \
            2>&1 | tee "${PROVENANCE_NETWORK_EVIDENCE}/native-sentry-actuation.log"
      - name: Retain exact-head disposable packet evidence
        if: always() && env.PROVENANCE_NETWORK_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: network-policy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PROVENANCE_NETWORK_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
