name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build
        run: go build ./cmd/provenance-runner

  gvisor-smoke:
    runs-on: ubuntu-latest
    env:
      GVISOR_NIGHTLY: 2026-08-30
      GVISOR_SHA512: e8eb6473e5a27316df551cbb40e5626e51df1b602bde2621f77d851c2c53b0387e282c7ebc0ee80ceb07a26e152e67b4af3e17550009e2c486e2f19666570449
      ALPINE_RELEASE: 3.24.1
      ALPINE_SHA512: de367c4fd4b5a2ab17f30fe62b135b98acd76c22014abdf51285588bde0edb7275265a84400418a5dab8cbdec36b3a41ca1312ca3af8e54438036455f26d72c1
      PROVENANCE_RUNSC_SMOKE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned gVisor build
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gvisor-x86_64.tar.bz2"
          install_root="/opt/provenance-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install_dir="${install_root}/gvisor"
          echo "PROVENANCE_INSTALL_ROOT=${install_root}" >> "${GITHUB_ENV}"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://storage.googleapis.com/gvisor/releases/nightly/${GVISOR_NIGHTLY}/x86_64/gvisor.tar.bz2"
          printf '%s  %s\n' "${GVISOR_SHA512}" "${archive}" | sha512sum --check --strict -
          sudo mkdir --parents "${install_dir}"
          sudo tar --extract --bzip2 --file "${archive}" --directory "${install_dir}"
          sudo chmod --recursive a+rX "${install_root}"
          sudo find "${install_dir}/gvisor-bin" -type f -exec chmod a+rx {} +
          sudo -u nobody test -x "${install_dir}/runsc"
          while IFS= read -r -d '' helper; do
            sudo -u nobody test -x "${helper}"
          done < <(find "${install_dir}/gvisor-bin" -type f -print0)
          "${install_dir}/runsc" --version
          wrapper="${install_dir}/runsc-provenance-smoke"
          # Per-run gofer namespaces avoid a persistent shared null-netns mount in the ephemeral test state root.
          printf '#!/bin/sh\nexec "%s/runsc" --gofer-network-namespace=new "$@"\n' "${install_dir}" | sudo tee "${wrapper}" > /dev/null
          sudo chmod 0755 "${wrapper}"
          echo "PROVENANCE_RUNSC_PATH=${wrapper}" >> "${GITHUB_ENV}"
      - name: Prepare pinned Alpine root filesystem
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/alpine-minirootfs-${ALPINE_RELEASE}-x86_64.tar.gz"
          rootfs="${PROVENANCE_INSTALL_ROOT}/alpine-rootfs"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-${ALPINE_RELEASE}-x86_64.tar.gz"
          printf '%s  %s\n' "${ALPINE_SHA512}" "${archive}" | sha512sum --check --strict -
          sudo mkdir --parents "${rootfs}"
          sudo tar --extract --gzip --file "${archive}" --directory "${rootfs}"
          sudo chmod --recursive go-rwx "${rootfs}"
          sudo test -x "${rootfs}/bin/sh"
          rootfs_sha=$(sudo scripts/prepare-gvisor-rootfs.sh prepare "${rootfs}")
          test -n "${rootfs_sha}"
          echo "PROVENANCE_RUNSC_ROOTFS=${rootfs}" >> "${GITHUB_ENV}"
      - name: Compile gVisor smoke test
        run: go test -c -o "${RUNNER_TEMP}/gvisor-smoke.test" ./internal/provider/gvisor
      - name: Prepare delegated cgroup subtree
        shell: bash
        run: |
          set -euo pipefail
          cgroup_parent="/sys/fs/cgroup/provenance-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir --parents "${cgroup_parent}/runner"
          controllers=$(< /sys/fs/cgroup/cgroup.controllers)
          if [[ -n "${controllers}" ]]; then
            printf '+%s\n' "${controllers// / +}" | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null
          fi
          controllers=$(< "${cgroup_parent}/cgroup.controllers")
          if [[ -n "${controllers}" ]]; then
            printf '+%s\n' "${controllers// / +}" | sudo tee "${cgroup_parent}/cgroup.subtree_control" > /dev/null
          fi
          echo "PROVENANCE_CGROUP_PARENT=${cgroup_parent}" >> "${GITHUB_ENV}"
      - name: Run real gVisor smoke test
        shell: bash
        run: |
          sudo --preserve-env=PROVENANCE_RUNSC_SMOKE,PROVENANCE_RUNSC_PATH,PROVENANCE_RUNSC_ROOTFS,PROVENANCE_CGROUP_PARENT \
            bash -c 'printf "%s\n" "$$" > "${PROVENANCE_CGROUP_PARENT}/runner/cgroup.procs"; exec "$@"' bash \
            "${RUNNER_TEMP}/gvisor-smoke.test" \
            -test.v \
            -test.run '^TestRunscSmoke$' \
            -test.count=1 \
            -test.timeout=60s
      - name: Remove delegated cgroup subtree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROVENANCE_CGROUP_PARENT:-}" ]]; then
            exit 0
          fi
          if [[ ! "${PROVENANCE_CGROUP_PARENT}" =~ ^/sys/fs/cgroup/provenance-ci-[0-9]+-[0-9]+$ ]]; then
            echo "refusing to remove unexpected cgroup path: ${PROVENANCE_CGROUP_PARENT}" >&2
            exit 1
          fi
          sudo find "${PROVENANCE_CGROUP_PARENT}" -mindepth 1 -depth -type d -exec rmdir {} +
          sudo rmdir "${PROVENANCE_CGROUP_PARENT}"
      - name: Remove installed smoke assets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROVENANCE_INSTALL_ROOT:-}" ]]; then
            exit 0
          fi
          if [[ ! "${PROVENANCE_INSTALL_ROOT}" =~ ^/opt/provenance-ci-[0-9]+-[0-9]+$ ]]; then
            echo "refusing to remove unexpected install path: ${PROVENANCE_INSTALL_ROOT}" >&2
            exit 1
          fi
          rootfs="${PROVENANCE_INSTALL_ROOT}/alpine-rootfs"
          if mountpoint --quiet -- "${rootfs}"; then
            sudo scripts/prepare-gvisor-rootfs.sh release "${rootfs}"
          fi
          sudo rm --recursive --force -- "${PROVENANCE_INSTALL_ROOT}"

  systemd-user-smoke:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure pinned dedicated-host SSH identity
        shell: bash
        env:
          PRODUCTION_RUNNER_SSH_KEY: ${{ secrets.PLAN0506_PRODUCTION_RUNNER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_RUNNER_SSH_KEY}"
          ssh_root="${RUNNER_TEMP}/provenance-runner-ssh"
          identity="${ssh_root}/id_ed25519"
          config="${ssh_root}/config"
          known_hosts="${ssh_root}/known_hosts"
          install -d -m 0700 "${ssh_root}"
          printf '%s\n' "${PRODUCTION_RUNNER_SSH_KEY}" > "${identity}"
          chmod 0600 "${identity}"
          ssh-keygen -y -f "${identity}" > "${identity}.pub"
          test "$(ssh-keygen -lf "${identity}.pub" -E sha256 | awk '{print $2}')" = "SHA256:Z9DNvPZH7acr9Sz9VjBq+Lv+ukBQHhnU2YqtLeCmwJY"
          printf '%s\n' '135.148.121.196 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFLnmu5PDwUSJ0HwG54kufzRF9tOHLNCfG4PZwOwINj+' > "${known_hosts}"
          chmod 0600 "${known_hosts}"
          printf '%s\n' \
            'Host provenance-runner' \
            '  HostName 135.148.121.196' \
            '  User provenance' \
            "  IdentityFile ${identity}" \
            '  IdentitiesOnly yes' \
            '  BatchMode yes' \
            '  PreferredAuthentications publickey' \
            '  PasswordAuthentication no' \
            '  KbdInteractiveAuthentication no' \
            '  StrictHostKeyChecking yes' \
            "  UserKnownHostsFile ${known_hosts}" \
            '  HostKeyAlias 135.148.121.196' \
            '  UpdateHostKeys no' \
            '  ForwardAgent no' \
            '  ForwardX11 no' \
            '  ClearAllForwardings yes' \
            '  PermitLocalCommand no' \
            '  RequestTTY no' \
            '  ProxyJump none' \
            '  ControlMaster no' \
            > "${config}"
          chmod 0600 "${config}"
          ssh -G -F "${config}" provenance-runner >/dev/null
          echo "PROVENANCE_SSH_CONFIG=${config}" >> "${GITHUB_ENV}"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build exact systemd-user smoke binary
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          [[ "${candidate}" =~ ^[0-9a-f]{40}$ ]]
          binary="${RUNNER_TEMP}/gvisor-systemd-user-smoke.test"
          evidence="${RUNNER_TEMP}/systemd-user-smoke-${candidate}"
          mkdir -m 0700 "${evidence}"
          go test -c -trimpath -o "${binary}" ./internal/provider/gvisor
          binary_sha="$(sha256sum "${binary}" | cut -d' ' -f1)"
          remote_dir="/var/lib/provenance-plan0506/ci-smoke/${candidate}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n \
            --arg candidateSha "${candidate}" \
            --arg binarySha256 "${binary_sha}" \
            --arg workflowRun "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{candidateSha:$candidateSha,binarySha256:$binarySha256,workflowRun:$workflowRun,hostAlias:"provenance-runner",expectedUser:"provenance",expectedUid:1001,expectedCgroupDriver:"systemd-user",expectedCgroupRoot:"/sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/app.slice"}' \
            > "${evidence}/metadata.json"
          echo "SYSTEMD_SMOKE_BINARY=${binary}" >> "${GITHUB_ENV}"
          echo "SYSTEMD_SMOKE_EVIDENCE=${evidence}" >> "${GITHUB_ENV}"
          echo "SYSTEMD_SMOKE_REMOTE_DIR=${remote_dir}" >> "${GITHUB_ENV}"
      - name: Run exact non-root smoke on dedicated host
        shell: bash
        run: |
          set -euo pipefail
          [[ "${SYSTEMD_SMOKE_REMOTE_DIR}" =~ ^/var/lib/provenance-plan0506/ci-smoke/[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          ssh_options=(
            -F "${PROVENANCE_SSH_CONFIG}"
            -o BatchMode=yes
            -o ClearAllForwardings=yes
            -o ExitOnForwardFailure=yes
            -o ForwardAgent=no
            -o ForwardX11=no
            -o PermitLocalCommand=no
            -o RequestTTY=no
            -o StrictHostKeyChecking=yes
          )
          ssh "${ssh_options[@]}" provenance-runner \
            'set -euo pipefail
             . /etc/os-release
             jq -n --arg host "$(hostname)" --arg user "$(id -un)" --argjson uid "$(id -u)" --arg os "$ID" --arg version "$VERSION_ID" --arg runscSha256 "$(sha256sum /opt/provenance-plan0506/bin/runsc | cut -d" " -f1)" --arg wrapperSha256 "$(sha256sum /opt/provenance-plan0506/bin/runsc-provenance | cut -d" " -f1)" "{host:\$host,user:\$user,uid:\$uid,os:\$os,version:\$version,runscSha256:\$runscSha256,wrapperSha256:\$wrapperSha256}"' \
            > "${SYSTEMD_SMOKE_EVIDENCE}/host-preflight.json"
          jq -e '.host == "vps-03bb1cbf" and .user == "provenance" and .uid == 1001 and .runscSha256 == "456ea862b62b48bb7ff27ae38c262b52315bf3d68ea0733164e4817cadc518a1" and .wrapperSha256 == "6e19e2c19e39f7b394ba71af24192de5d145c8f794ff0ab63f450d5bed136d7d"' \
            "${SYSTEMD_SMOKE_EVIDENCE}/host-preflight.json" >/dev/null
          ssh "${ssh_options[@]}" provenance-runner \
            "set -eu; test ! -e '${SYSTEMD_SMOKE_REMOTE_DIR}'; install -d -m 0700 /var/lib/provenance-plan0506/ci-smoke '${SYSTEMD_SMOKE_REMOTE_DIR}'"
          scp "${ssh_options[@]}" -- "${SYSTEMD_SMOKE_BINARY}" \
            "provenance-runner:${SYSTEMD_SMOKE_REMOTE_DIR}/gvisor-smoke.test"
          ssh "${ssh_options[@]}" provenance-runner \
            "set -euo pipefail
             test \"\$(id -un)\" = provenance
             test \"\$(id -u)\" = 1001
             chmod 0500 '${SYSTEMD_SMOKE_REMOTE_DIR}/gvisor-smoke.test'
             systemctl --user start app.slice
             exec systemd-run --user --scope --collect --quiet --slice=app.slice --unit=provenance-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} env \
               PROVENANCE_RUNSC_SMOKE=1 \
               PROVENANCE_RUNSC_PATH=/opt/provenance-plan0506/bin/runsc-provenance \
               PROVENANCE_RUNSC_ROOTFS=/var/lib/provenance-plan0506/bootstrap-smoke/alpine-rootfs \
               PROVENANCE_GVISOR_CGROUP_DRIVER=systemd-user \
               PROVENANCE_SYSTEMD_RUN_PATH=/usr/bin/systemd-run \
               PROVENANCE_SYSTEMD_CGROUP_ROOT=/sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/app.slice \
               PROVENANCE_CGROUP_PARENT=/sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/app.slice \
               '${SYSTEMD_SMOKE_REMOTE_DIR}/gvisor-smoke.test' \
                 -test.v -test.run '^TestRunscSmoke$' -test.count=1 -test.timeout=120s" \
            | tee "${SYSTEMD_SMOKE_EVIDENCE}/smoke.log"
          grep -F -- '--- PASS: TestRunscSmoke/systemd_user_scope_applies_exact_limits' \
            "${SYSTEMD_SMOKE_EVIDENCE}/smoke.log" >/dev/null
          jq -n \
            --arg cgroupDriver "systemd-user" \
            --arg cgroupRoot "/sys/fs/cgroup/user.slice/user-1001.slice/user@1001.service/app.slice" \
            --arg assertion "TestRunscSmoke/systemd_user_scope_applies_exact_limits" \
            '{cgroupDriver:$cgroupDriver,cgroupRoot:$cgroupRoot,verifiedAssertion:$assertion}' \
            > "${SYSTEMD_SMOKE_EVIDENCE}/execution.json"
          ssh "${ssh_options[@]}" provenance-runner \
            'set -euo pipefail
             . /etc/os-release
             residual_scopes="$(systemctl --user list-units --all --plain --no-legend "provenance-*.scope" | awk "{print \$1}" | wc -l)"
             jq -n --arg host "$(hostname)" --arg user "$(id -un)" --argjson uid "$(id -u)" --arg os "$ID" --arg version "$VERSION_ID" --arg runscSha256 "$(sha256sum /opt/provenance-plan0506/bin/runsc | cut -d" " -f1)" --arg wrapperSha256 "$(sha256sum /opt/provenance-plan0506/bin/runsc-provenance | cut -d" " -f1)" --arg completedAt "$(date -u +%FT%TZ)" --argjson residualScopes "$residual_scopes" "{host:\$host,user:\$user,uid:\$uid,os:\$os,version:\$version,runscSha256:\$runscSha256,wrapperSha256:\$wrapperSha256,completedAt:\$completedAt,residualScopes:\$residualScopes}"' \
            > "${SYSTEMD_SMOKE_EVIDENCE}/host.json"
          jq -e '.host == "vps-03bb1cbf" and .user == "provenance" and .uid == 1001 and .runscSha256 == "456ea862b62b48bb7ff27ae38c262b52315bf3d68ea0733164e4817cadc518a1" and .wrapperSha256 == "6e19e2c19e39f7b394ba71af24192de5d145c8f794ff0ab63f450d5bed136d7d" and .residualScopes == 0' \
            "${SYSTEMD_SMOKE_EVIDENCE}/host.json" >/dev/null
          (cd "${SYSTEMD_SMOKE_EVIDENCE}" && sha256sum execution.json host-preflight.json host.json metadata.json smoke.log > manifest.sha256)
      - name: Upload exact-head systemd-user smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-user-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.SYSTEMD_SMOKE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 90
      - name: Remove exact remote smoke directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SYSTEMD_SMOKE_REMOTE_DIR:-}" ]]; then
            exit 0
          fi
          [[ "${SYSTEMD_SMOKE_REMOTE_DIR}" =~ ^/var/lib/provenance-plan0506/ci-smoke/[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          ssh -F "${PROVENANCE_SSH_CONFIG}" \
            -o BatchMode=yes -o ClearAllForwardings=yes -o ExitOnForwardFailure=yes \
            -o ForwardAgent=no -o ForwardX11=no -o PermitLocalCommand=no \
            -o RequestTTY=no -o StrictHostKeyChecking=yes provenance-runner \
            "find '${SYSTEMD_SMOKE_REMOTE_DIR}' -type f -exec chmod u+rw {} + 2>/dev/null || true; rm -rf -- '${SYSTEMD_SMOKE_REMOTE_DIR}'"

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ssh_root="${RUNNER_TEMP}/provenance-runner-ssh"
          test "${ssh_root}" = "${RUNNER_TEMP}/provenance-runner-ssh"
          rm -rf -- "${ssh_root}"
