name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build
        run: go build ./cmd/provenance-runner

  gvisor-smoke:
    runs-on: ubuntu-latest
    env:
      GVISOR_NIGHTLY: 2026-08-30
      GVISOR_SHA512: e8eb6473e5a27316df551cbb40e5626e51df1b602bde2621f77d851c2c53b0387e282c7ebc0ee80ceb07a26e152e67b4af3e17550009e2c486e2f19666570449
      ALPINE_RELEASE: 3.24.1
      ALPINE_SHA512: de367c4fd4b5a2ab17f30fe62b135b98acd76c22014abdf51285588bde0edb7275265a84400418a5dab8cbdec36b3a41ca1312ca3af8e54438036455f26d72c1
      PROVENANCE_RUNSC_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned gVisor build
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gvisor-x86_64.tar.bz2"
          install_dir="${RUNNER_TEMP}/gvisor"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://storage.googleapis.com/gvisor/releases/nightly/${GVISOR_NIGHTLY}/x86_64/gvisor.tar.bz2"
          printf '%s  %s\n' "${GVISOR_SHA512}" "${archive}" | sha512sum --check --strict -
          mkdir --parents "${install_dir}"
          tar --extract --bzip2 --file "${archive}" --directory "${install_dir}"
          chmod --recursive a+rX "${install_dir}"
          test -x "${install_dir}/runsc"
          "${install_dir}/runsc" --version
          echo "PROVENANCE_RUNSC_PATH=${install_dir}/runsc" >> "${GITHUB_ENV}"
      - name: Prepare pinned Alpine root filesystem
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/alpine-minirootfs-${ALPINE_RELEASE}-x86_64.tar.gz"
          rootfs="${RUNNER_TEMP}/alpine-rootfs"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-minirootfs-${ALPINE_RELEASE}-x86_64.tar.gz"
          printf '%s  %s\n' "${ALPINE_SHA512}" "${archive}" | sha512sum --check --strict -
          mkdir --parents "${rootfs}"
          sudo tar --extract --gzip --file "${archive}" --directory "${rootfs}"
          sudo test -x "${rootfs}/bin/sh"
          echo "PROVENANCE_RUNSC_ROOTFS=${rootfs}" >> "${GITHUB_ENV}"
      - name: Compile gVisor smoke test
        run: go test -c -o "${RUNNER_TEMP}/gvisor-smoke.test" ./internal/provider/gvisor
      - name: Prepare delegated cgroup subtree
        shell: bash
        run: |
          set -euo pipefail
          cgroup_parent="/sys/fs/cgroup/provenance-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir --parents "${cgroup_parent}/runner"
          controllers=$(< /sys/fs/cgroup/cgroup.controllers)
          if [[ -n "${controllers}" ]]; then
            printf '+%s\n' "${controllers// / +}" | sudo tee /sys/fs/cgroup/cgroup.subtree_control > /dev/null
          fi
          controllers=$(< "${cgroup_parent}/cgroup.controllers")
          if [[ -n "${controllers}" ]]; then
            printf '+%s\n' "${controllers// / +}" | sudo tee "${cgroup_parent}/cgroup.subtree_control" > /dev/null
          fi
          echo "PROVENANCE_CGROUP_PARENT=${cgroup_parent}" >> "${GITHUB_ENV}"
      - name: Run real gVisor smoke test
        shell: bash
        run: |
          sudo --preserve-env=PROVENANCE_RUNSC_SMOKE,PROVENANCE_RUNSC_PATH,PROVENANCE_RUNSC_ROOTFS,PROVENANCE_CGROUP_PARENT \
            bash -c 'printf "%s\n" "$$" > "${PROVENANCE_CGROUP_PARENT}/runner/cgroup.procs"; exec "$@"' bash \
            "${RUNNER_TEMP}/gvisor-smoke.test" \
            -test.v \
            -test.run '^TestRunscSmoke$' \
            -test.count=1 \
            -test.timeout=60s
      - name: Remove delegated cgroup subtree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROVENANCE_CGROUP_PARENT:-}" ]]; then
            exit 0
          fi
          if [[ ! "${PROVENANCE_CGROUP_PARENT}" =~ ^/sys/fs/cgroup/provenance-ci-[0-9]+-[0-9]+$ ]]; then
            echo "refusing to remove unexpected cgroup path: ${PROVENANCE_CGROUP_PARENT}" >&2
            exit 1
          fi
          sudo rmdir "${PROVENANCE_CGROUP_PARENT}/runner"
          sudo rmdir "${PROVENANCE_CGROUP_PARENT}"
